[package]
name = "pump"
version = "0.2.6"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "0e6dd4c1d290fc34e094dc5838725d89c13d8bfe", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "3e48018c41415729b66d54b85309c14ad8419597", features = ["radiant-gui"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = ["radiant-gui"]
radiant-gui = ["toybox/radiant-gui"]
vst3 = ["toybox/radiant-vst3", "radiant-gui"]
screenshot-test = ["dep:image", "radiant-gui"]
