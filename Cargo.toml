[package]
name = "pump"
version = "0.2.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "119f95cfebab84687b7af870f3bf6e385f365346", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "49d49747d83086ee3683f1951227413663c4c8e0", features = ["gui"] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = []
screenshot-test = ["toybox/screenshot-test"]
vst3 = ["toybox/vst3"]

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
