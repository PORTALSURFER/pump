[package]
name = "pump"
version = "0.2.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "9b45df71893a71f165fcae4183a189d664cecb10", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "805fef15cb6021b35120a34f6008d106f6814065", features = ["gui"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = []
screenshot-test = ["toybox/screenshot-test"]
vst3 = ["toybox/radiant-vst3"]

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
