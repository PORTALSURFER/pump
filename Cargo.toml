[package]
name = "pump"
version = "0.2.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "d170c798b72a2ac0f7cea6826d122834430cd9d9", features = ["gui"] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = []
screenshot-test = ["toybox/screenshot-test"]
vst3 = ["toybox/vst3"]

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
