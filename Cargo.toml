[package]
name = "pump"
version = "0.2.6"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "7001b84b2c7edd4a286d167c183a5b35366156fc", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "e8fcd2e99b1fb62b3d869b6e5312a12700c82fdf", features = ["radiant-gui"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "e8fcd2e99b1fb62b3d869b6e5312a12700c82fdf", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = ["radiant-gui"]
radiant-gui = ["toybox/radiant-gui"]
vst3 = ["toybox/radiant-vst3", "radiant-gui"]
screenshot-test = ["dep:image", "radiant-gui"]
