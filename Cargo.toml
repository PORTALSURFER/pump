[package]
name = "pump"
version = "0.2.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "119f95cfebab84687b7af870f3bf6e385f365346", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "2c0317e6cc777258d6bf573cf8e802fd96dc02fa", features = ["gui"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = []
screenshot-test = ["toybox/screenshot-test"]
vst3 = ["toybox/vst3"]

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
