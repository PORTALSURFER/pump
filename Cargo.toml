[package]
name = "pump"
version = "0.1.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "47992bf0ab30e8b36233a7e27679acaa6d028b11", features = ["gui"] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = []
screenshot-test = ["toybox/screenshot-test"]
vst3 = ["toybox/vst3"]

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
