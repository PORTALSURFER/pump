[package]
name = "pump"
version = "0.2.7"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pump_gpui_screenshot"
path = "examples/pump_gpui_screenshot.rs"
required-features = ["screenshot-test"]
test = false
bench = false

[[bin]]
name = "pump_gpui_input"
path = "examples/pump_gpui_input.rs"
required-features = ["screenshot-test"]
test = false
bench = false

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "db656f567fb3c9e7ce3f1b1acd07a77ce7206170", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
unicode-segmentation = "1.12"

[build-dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "db656f567fb3c9e7ce3f1b1acd07a77ce7206170", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.5.2"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = ["gpui-gui"]
gpui-gui = ["toybox/gpui-gui"]
vst3 = ["toybox/gpui-vst3", "gpui-gui"]
screenshot-test = ["dep:image", "gpui-gui"]
