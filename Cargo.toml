[package]
name = "pump"
version = "0.2.0"
edition = "2021"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "b21a4caa094294b3eb2b2b87f6c6bc08ced8b137", default-features = false }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "1c40aeee6062b3bcebc2799fa2ab65cf36d160a2", features = ["radiant-gui"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# Default to CLAP-only builds so CI does not require the VST3 SDK. Enable VST3
# explicitly when producing a VST3 binary.
default = ["radiant-gui"]
radiant-gui = ["toybox/radiant-gui"]
vst3 = ["toybox/radiant-vst3", "radiant-gui"]
screenshot-test = ["dep:image", "radiant-gui"]
