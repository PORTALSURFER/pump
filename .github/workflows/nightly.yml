name: Pump nightly scheduler

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      force:
        description: Prepare a new patch nightly even when the source is unchanged
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: pump-nightly-scheduler
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.repository == 'PORTALSURFER/pump' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      COORDINATOR_POLL_SECONDS: "30"
      COORDINATOR_TIMEOUT_SECONDS: "10500"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare, validate, and publish the next nightly patch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: python3 scripts/nightly_coordinator.py
