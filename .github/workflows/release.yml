name: Pump release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, rc, nightly]
      publish:
        description: Publish after production signing and notarization
        required: true
        default: false
        type: boolean
      only_if_changed:
        description: Publish only when this channel has changed since its latest release
        required: false
        default: false
        type: boolean

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  VST3_SDK_REPOSITORY: https://github.com/steinbergmedia/vst3sdk.git
  VST3_SDK_REVISION: 58f8da7936800732561402d7936584ca4505de07

concurrency:
  group: pump-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      publication_version: ${{ steps.metadata.outputs.publication_version }}
      build_id: ${{ steps.metadata.outputs.build_id }}
      released_at: ${{ steps.metadata.outputs.released_at }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dispatched source SHA
        id: source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${source_sha}" = "${EXPECTED_SHA}"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Compute shared release metadata
        id: metadata
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WORKFLOW_SEQUENCE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')"
          publication_version="$(python3 - "${package_version}" "${RELEASE_CHANNEL}" "${WORKFLOW_SEQUENCE}" <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from release_helper import derive_publication_version

          print(derive_publication_version(sys.argv[1], sys.argv[2], sys.argv[3]))
          PY
          )"
          build_id="pump-v${publication_version}-${SOURCE_SHA:0:12}"
          released_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "package_version=${package_version}"
            echo "publication_version=${publication_version}"
            echo "build_id=${build_id}"
            echo "released_at=${released_at}"
          } >> "$GITHUB_OUTPUT"

      - name: Check release source freshness
        id: gate
        env:
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASES_URL: https://portalsurfer.org/plugins/api/v1/products/pump/releases
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONLY_IF_CHANGED}" != true ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          releases_json="${RUNNER_TEMP}/pump-releases.json"
          curl --fail --silent --show-error --location --max-time 30 "${RELEASES_URL}" > "${releases_json}"
          python3 - "${SOURCE_SHA}" "${releases_json}" "${GITHUB_OUTPUT}" "${RELEASE_CHANNEL}" <<'PY'
          import datetime as dt
          import json
          import re
          import sys
          from pathlib import Path

          source_sha, releases_path, output_path, channel = sys.argv[1:]
          document = json.loads(Path(releases_path).read_text(encoding="utf-8"))
          releases = document.get("releases") if isinstance(document, dict) else None
          if not isinstance(releases, list):
              raise SystemExit("release history must contain a releases array")
          latest = None
          for release in releases:
              if not isinstance(release, dict) or release.get("channel") != channel:
                  continue
              source = release.get("source")
              timestamp = release.get("released_at")
              candidate = source.get("git_sha") if isinstance(source, dict) else None
              if (
                  not isinstance(source, dict)
                  or source.get("repository") != "PORTALSURFER/pump"
                  or not isinstance(timestamp, str)
                  or not isinstance(candidate, str)
                  or not re.fullmatch(r"[0-9a-f]{40}", candidate)
              ):
                  raise SystemExit("matching release source metadata is invalid")
              parsed = dt.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise SystemExit("matching release timestamp must include a timezone")
              if latest is None or parsed > latest[0]:
                  latest = (parsed, candidate)
          with Path(output_path).open("a", encoding="utf-8") as output:
              output.write(f"should_release={str(latest is None or latest[1] != source_sha).lower()}\n")
          PY

      - name: Stop when the selected channel is unchanged
        if: steps.gate.outputs.should_release != 'true'
        run: echo "selected release channel already contains this source SHA"

  publisher_preflight_gate:
    if: ${{ inputs.publish == true && needs.prepare.outputs.should_release == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact prepared source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact prepared source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - name: Verify protected publisher preflight evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_preflight_gate.py

  windows:
    if: needs.prepare.outputs.should_release == 'true' && inputs.channel == 'nightly'
    needs: prepare
    uses: ./.github/workflows/windows-release.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      publication_version: ${{ needs.prepare.outputs.publication_version }}
      channel: ${{ inputs.channel }}
      build_id: ${{ needs.prepare.outputs.build_id }}
      released_at: ${{ needs.prepare.outputs.released_at }}
    permissions:
      contents: read

  macos_release:
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_release == 'true' && (inputs.publish != true || needs.publisher_preflight_gate.result == 'success') && (inputs.channel != 'nightly' || needs.windows.result == 'success') }}
    needs: [prepare, windows, publisher_preflight_gate]
    runs-on: macos-latest
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify shared source identity
        env:
          EXPECTED_GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$(git symbolic-ref --quiet --short HEAD)" = main
          test "${source_sha}" = "${EXPECTED_GITHUB_SHA}"
          test "${source_sha}" = "${EXPECTED_SOURCE_SHA}"

      - name: Configure private git dependencies
        env:
          RADIANT_REPO_TOKEN: ${{ secrets.RADIANT_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RADIANT_REPO_TOKEN}"
          git config --global url."https://x-access-token:${RADIANT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Checkout pinned VST3 SDK
        run: |
          set -euo pipefail
          git clone "${VST3_SDK_REPOSITORY}" "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" fetch --depth 1 origin "${VST3_SDK_REVISION}"
          git -C "$RUNNER_TEMP/vst3sdk" checkout --detach "${VST3_SDK_REVISION}"
          test "$(git -C "$RUNNER_TEMP/vst3sdk" rev-parse HEAD)" = "${VST3_SDK_REVISION}"
          test -d "$RUNNER_TEMP/vst3sdk/pluginterfaces"
          echo "VST3_SDK_DIR=$RUNNER_TEMP/vst3sdk" >> "$GITHUB_ENV"

      - name: Download Windows nightly artifact
        if: inputs.channel == 'nightly'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pump-windows-${{ needs.prepare.outputs.build_id }}
          path: ${{ runner.temp }}/pump-windows

      - name: Validate Windows sidecar and shared identity
        if: inputs.channel == 'nightly'
        env:
          WINDOWS_RELEASE_DIR: ${{ runner.temp }}/pump-windows
          EXPECTED_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          EXPECTED_PUBLICATION_VERSION: ${{ needs.prepare.outputs.publication_version }}
          EXPECTED_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          EXPECTED_RELEASED_AT: ${{ needs.prepare.outputs.released_at }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/windows_release_helper.py validate \
            --root "${WINDOWS_RELEASE_DIR}" \
            --cargo-lock Cargo.lock \
            --vst3-sdk-revision "${VST3_SDK_REVISION}"
          python3 - "${WINDOWS_RELEASE_DIR}" "${EXPECTED_PACKAGE_VERSION}" "${EXPECTED_PUBLICATION_VERSION}" "${EXPECTED_BUILD_ID}" "${EXPECTED_RELEASED_AT}" "${EXPECTED_SOURCE_SHA}" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          package_version, publication_version, build_id, released_at, source_sha = sys.argv[2:]
          manifest = json.loads((root / "windows-artifact-manifest.json").read_text(encoding="utf-8"))
          expected_archive = f"pump-v{publication_version}-windows-x86_64-unsigned.vst3.zip"
          expected_build_id = f"pump-v{publication_version}-{source_sha[:12]}"
          source = manifest.get("source")
          if (
              manifest.get("schema_version") != 1
              or manifest.get("product") != "pump"
              or manifest.get("format") != "vst3"
              or manifest.get("platform") != "windows"
              or manifest.get("architecture") != "x86_64"
              or manifest.get("package_version") != package_version
              or manifest.get("publication_version") != publication_version
              or manifest.get("channel") != "nightly"
              or manifest.get("build_id") != expected_build_id
              or manifest.get("build_id") != build_id
              or manifest.get("released_at") != released_at
              or not isinstance(source, dict)
              or source.get("repository") != "PORTALSURFER/pump"
              or source.get("git_sha") != source_sha
              or source.get("dirty") is not False
              or manifest.get("signing_status") != "unsigned"
              or manifest.get("signing_certificate") is not None
              or not isinstance(manifest.get("archive"), dict)
              or manifest["archive"].get("name") != expected_archive
          ):
              raise SystemExit("Windows artifact manifest does not match the shared nightly identity")
          expected_entries = {"windows-artifact-manifest.json", expected_archive}
          entries = list(root.iterdir())
          if {entry.name for entry in entries} != expected_entries or any(entry.is_symlink() or not entry.is_file() for entry in entries):
              raise SystemExit("Windows release directory must contain only the archive and its sidecar")
          PY

      - name: Create scoped PortalSurfer publisher token
        id: publisher_token
        if: inputs.publish == true
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        with:
          app-id: ${{ vars.PORTALSURFER_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PORTALSURFER_PUBLISHER_PRIVATE_KEY }}
          owner: PORTALSURFER
          repositories: portalsurfer.org
          permission-contents: read
      - name: Checkout exact PortalSurfer publisher
        if: inputs.publish == true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PORTALSURFER/portalsurfer.org
          ref: 12d2c089d3d135c6839013a097dbf3baebf5fdb3
          token: ${{ steps.publisher_token.outputs.token }}
          path: portalsurfer-publisher
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and stage pinned PortalSurfer publisher
        id: publisher
        if: inputs.publish == true
        env:
          PUBLISHER_COMMIT: 12d2c089d3d135c6839013a097dbf3baebf5fdb3
        shell: bash
        run: |
          set -euo pipefail
          publisher_dir="${GITHUB_WORKSPACE}/portalsurfer-publisher"
          test "$(git -C "${publisher_dir}" rev-parse HEAD)" = "${PUBLISHER_COMMIT}"
          ! git -C "${publisher_dir}" symbolic-ref --quiet HEAD
          test -z "$(git -C "${publisher_dir}" status --porcelain --untracked-files=all)"
          staged_publisher_dir="${RUNNER_TEMP}/portalsurfer-publisher"
          rm -rf -- "${staged_publisher_dir}"
          cp -a "${publisher_dir}" "${staged_publisher_dir}"
          rm -rf -- "${publisher_dir}"
          publisher_script="${staged_publisher_dir}/scripts/publish-plugin-release.mjs"
          test -f "${publisher_script}" && test ! -L "${publisher_script}"
          echo "path=${publisher_script}" >> "$GITHUB_OUTPUT"

      - name: Produce and optionally publish Pump release
        env:
          PORTALSURFER_RELEASE_TOKEN: ${{ inputs.publish && secrets.PORTALSURFER_RELEASE_TOKEN || '' }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          WINDOWS_RELEASE_DIR: ${{ runner.temp }}/pump-windows
          PUBLISHER_SCRIPT: ${{ steps.publisher.outputs.path }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          RELEASE_PUBLICATION_VERSION: ${{ needs.prepare.outputs.publication_version }}
          RELEASE_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          RELEASED_AT: ${{ needs.prepare.outputs.released_at }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            --channel "${RELEASE_CHANNEL}"
            --version "${RELEASE_PACKAGE_VERSION}"
            --publication-version "${RELEASE_PUBLICATION_VERSION}"
            --build-id "${RELEASE_BUILD_ID}"
            --released-at "${RELEASED_AT}"
            --source-ref main
            --source-sha "${RELEASE_SOURCE_SHA}"
          )
          if [[ "${RELEASE_CHANNEL}" == nightly ]]; then
            release_args+=(--windows-release-dir "${WINDOWS_RELEASE_DIR}")
          fi
          if [[ "${{ inputs.publish }}" == true ]]; then
            release_args+=(--publish --publisher-script "${PUBLISHER_SCRIPT:?pinned publisher path is missing}")
          else
            release_args+=(--package-only)
          fi
          bash scripts/release.sh "${release_args[@]}"

      - name: Upload immutable bundle for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pump-release-${{ inputs.channel }}-${{ needs.prepare.outputs.source_sha }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 3

      - name: Reconcile metadata-only GitHub Release
        if: inputs.publish == true && inputs.channel != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.package_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${{ github.repository }}" --title "${{ inputs.channel }} ${tag}" --notes "PortalSurfer manifest release; binaries are served by PortalSurfer."
          else
            gh release create "${tag}" --repo "${{ github.repository }}" --target "${SOURCE_SHA}" --title "${{ inputs.channel }} ${tag}" --notes "PortalSurfer manifest release; binaries are served by PortalSurfer."
          fi
